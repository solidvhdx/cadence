name: Build & Test (Windows MSVC)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure CMake (MSVC C++23)
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run Core Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path build/Release/Cadence.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Cadence.exe" | Set-Content -Path build/Release/SHA256SUMS.txt -Encoding ascii
          Get-Content build/Release/SHA256SUMS.txt

      - name: Upload Cadence.exe & SHA256SUMS Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cadence-win64
          path: |
            build/Release/Cadence.exe
            build/Release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Cadence-win64
          path: dist

      - name: Verify SHA256SUMS before publishing
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/Cadence.exe
            dist/SHA256SUMS.txt
